name: Release packages

# Publishing a GitHub release (e.g. tag v1.1) builds the static binary and the
# .deb, attaches both to the release, and adds the .deb to the apt repository
# served from the gh-pages branch (https://kristijanmatas.github.io/unimap).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)package, e.g. v1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils

      - name: Build static binary and .deb
        run: |
          VERSION=${TAG#v}
          packaging/build-deb.sh "$VERSION" dist
          cc -O2 -Wall -Wextra -static -s -o dist/unimap-linux-x86_64 unimap.c
          ls -l dist

      - name: Attach to release
        run: gh release upload "$TAG" dist/* --clobber

      - name: Check out apt repository (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import

      - name: Update apt repository
        run: packaging/update-apt-repo.sh site dist/*.deb

      - name: Publish
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add unimap $TAG to apt repository" || exit 0
          git push
